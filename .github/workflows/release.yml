name: Release

# Push a tag like v0.1.0 (matching Cargo.toml's version) to build and publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # Ubuntu 22.04 = glibc 2.35, so the binary runs on most current distros.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$TAG" ] || { echo "Tag $TAG does not match Cargo.toml version $v"; exit 1; }
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          name=biblewolf-${TAG}-linux-${{ matrix.arch }}
          mkdir -p "dist/$name"
          cp target/release/biblewolf README.md LICENSE "dist/$name/"
          cp packaging/linux/biblewolf.desktop "dist/$name/"
          cp assets/icon/biblewolf-256.png "dist/$name/biblewolf.png"
          cat > "dist/$name/install.sh" <<'SH'
          #!/bin/sh
          # Installs BibleWolf for the current user (~/.local).
          set -e
          here=$(cd "$(dirname "$0")" && pwd)
          install -Dm755 "$here/biblewolf" "$HOME/.local/bin/biblewolf"
          install -Dm644 "$here/biblewolf.png" "$HOME/.local/share/icons/hicolor/256x256/apps/biblewolf.png"
          install -Dm644 "$here/biblewolf.desktop" "$HOME/.local/share/applications/biblewolf.desktop"
          echo "BibleWolf installed. Launch it from your app menu, or run: biblewolf"
          SH
          chmod +x "dist/$name/install.sh"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - name: Package
        shell: pwsh
        run: |
          $name = "biblewolf-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/biblewolf.exe, README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: dist/*.zip

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo test --locked --release
      - name: Build both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
      - name: Bundle BibleWolf.app and .dmg
        shell: bash
        run: |
          version=${TAG#v}
          app=dist/BibleWolf.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/biblewolf" \
            target/aarch64-apple-darwin/release/biblewolf \
            target/x86_64-apple-darwin/release/biblewolf
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=dist/biblewolf.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon/biblewolf-1024.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon/biblewolf-1024.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/biblewolf.icns"
          # Ad-hoc signature: required for Apple Silicon to launch it at all.
          # (Not notarised: first launch needs right-click > Open.)
          codesign --force --deep --sign - "$app"
          stage=dist/dmg
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          cp README.md LICENSE "$stage/"
          hdiutil create -volname "BibleWolf" -srcfolder "$stage" -ov -format UDZO \
            "dist/biblewolf-${TAG}-macos-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg

  publish:
    name: Publish GitHub release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Downloads

          | Platform | File |
          |---|---|
          | Windows 10/11 (64-bit) | \`biblewolf-${TAG}-windows-x86_64.zip\` |
          | macOS 11+ (Apple Silicon & Intel) | \`biblewolf-${TAG}-macos-universal.dmg\` |
          | Linux x86_64 | \`biblewolf-${TAG}-linux-x86_64.tar.gz\` |
          | Linux ARM64 | \`biblewolf-${TAG}-linux-aarch64.tar.gz\` |

          The builds are not code-signed yet. See the README's install section for the one-time
          "Open anyway" step on macOS and Windows. Verify downloads against \`SHA256SUMS.txt\`.
          EOF
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "BibleWolf $TAG" \
            --notes-file notes.md \
            --verify-tag
