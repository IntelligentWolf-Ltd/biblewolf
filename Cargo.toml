[package]
name = "biblewolf"
version = "0.2.0"
edition = "2024"
description = "BibleWolf — Bible study desktop app"
authors = ["IntelligentWolf Ltd <https://wolf.uk.com>"]
homepage = "https://wolf.uk.com"
repository = "https://github.com/intelligentwolf/biblewolf"
license = "MIT"
readme = "README.md"
keywords = ["bible", "study", "egui", "desktop"]
categories = ["gui"]
rust-version = "1.89"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11", "persistence"] }
egui = "0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
dirs = "6"
ureq = "3"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
